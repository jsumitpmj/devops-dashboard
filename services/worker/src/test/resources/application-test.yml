spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-must-be-long-enough-for-hs256-at-least-32-chars
  expiration-ms: 3600000

worker:
  poll-interval-ms: 999999999
  stale-timeout-minutes: 30
  sync-interval-ms: 999999999
  notification-service-url: http://localhost:19999

app:
  version: 0.0.0-test

logging:
  level:
    root: warn
