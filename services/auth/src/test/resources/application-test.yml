spring:
  application:
    name: auth-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop    # recreate schema per test run
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 0     # random port for parallel test runs

jwt:
  secret: test-only-secret-must-be-at-least-32-chars-long-for-hs256
  expiration-ms: 3600000   # 1 hour for tests

app:
  version: 0.0.0-test

logging:
  level:
    root: warn
    com.devops.dashboard: info
