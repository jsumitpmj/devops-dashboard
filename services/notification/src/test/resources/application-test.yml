spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-must-be-long-enough-for-hs256-at-least-32-chars
  expiration-ms: 3600000

notification:
  email:
    enabled: true
    from: test@devops.local
    smtp-host: localhost
    smtp-port: 1025
  slack:
    enabled: true
    webhook-url: https://hooks.slack.example.com/test
  retry:
    max-attempts: 1
    delay-ms: 100

app:
  version: 0.0.0-test

logging:
  level:
    root: warn
