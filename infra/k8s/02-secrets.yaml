# =============================================================================
# Secrets — TEMPLATE
# =============================================================================
# Replace the base64 values below before applying.
#
# Encode a value:   echo -n 'my-value' | base64
#
# Examples used here (DO NOT use in production):
#   devops          → ZGV2b3Bz
#   change-me...    → Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbXVzdC1iZS1hdC1sZWFzdC0zMi1jaGFycw==
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: devops-secrets
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/part-of: devops-dashboard
type: Opaque
data:
  # echo -n 'devops' | base64
  DB_PASSWORD: ZGV2b3Bz

  # echo -n 'change-me-in-production-must-be-at-least-32-chars' | base64
  JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbXVzdC1iZS1hdC1sZWFzdC0zMi1jaGFycw==

  # Slack webhook (empty placeholder)
  NOTIFICATION_SLACK_WEBHOOK: ""

---
# PostgreSQL credentials (used by the StatefulSet)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/part-of: devops-dashboard
type: Opaque
data:
  POSTGRES_USER: ZGV2b3Bz
  POSTGRES_PASSWORD: ZGV2b3Bz
  POSTGRES_DB: ZGV2b3BzX2Rhc2hib2FyZA==
