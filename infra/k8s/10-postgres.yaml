# =============================================================================
# PostgreSQL — Dev-only StatefulSet
# =============================================================================
# For production, use a managed database (RDS, Cloud SQL, etc.)
# and remove this manifest entirely.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: devops-dashboard
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secrets
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "devops", "-d", "devops_dashboard"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devops", "-d", "devops_dashboard"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

# Note: The 'postgres-init' ConfigMap referenced above is created from SQL files:
#   kubectl create configmap postgres-init \
#     --from-file=01_init.sql=infra/db/init.sql \
#     --from-file=02_seed.sql=scripts/seed.sql \
#     -n devops-dashboard
