# =============================================================================
# Horizontal Pod Autoscalers
# =============================================================================
# Scale the user-facing services based on CPU/memory utilization.
#
# Services NOT auto-scaled:
#   - worker      (single replica to avoid duplicate job processing)
#   - notification (single replica for ordering guarantees)
#   - postgres     (StatefulSet, managed separately)
#
# Prerequisites:
#   - metrics-server must be installed in the cluster
#     kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: devops-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

