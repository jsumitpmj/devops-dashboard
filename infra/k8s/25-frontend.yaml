# =============================================================================
# Frontend (Next.js) — Deployment + Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: devops-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: devops-dashboard/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api:4000"
            - name: NEXT_PUBLIC_AUTH_URL
              value: "http://auth:4001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
