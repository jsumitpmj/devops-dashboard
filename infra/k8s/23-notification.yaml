# =============================================================================
# Notification Service — Deployment + Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 4003
      targetPort: 4003
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notification

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: devops-dashboard
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: notification
          image: devops-dashboard/notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
              name: http
          env:
            - name: PORT
              value: "4003"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: JWT_SECRET
            - name: NOTIFICATION_EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_EMAIL_ENABLED
            - name: NOTIFICATION_EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_EMAIL_FROM
            - name: NOTIFICATION_SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_SMTP_HOST
            - name: NOTIFICATION_SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_SMTP_PORT
            - name: NOTIFICATION_SLACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_SLACK_ENABLED
            - name: NOTIFICATION_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: NOTIFICATION_SLACK_WEBHOOK
                  optional: true
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 640Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15
