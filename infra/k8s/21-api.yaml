# =============================================================================
# API Gateway Service — Deployment + Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops-dashboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: devops-dashboard
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: devops-dashboard
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: devops-dashboard/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15
