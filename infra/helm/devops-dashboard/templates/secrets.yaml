# =============================================================================
# Secrets — values are base64-encoded at render time from plain-text values.
# For production, replace with an external secrets manager
# (e.g. External Secrets Operator, Vault Agent, Sealed Secrets).
# =============================================================================

# Application secrets
apiVersion: v1
kind: Secret
metadata:
  name: devops-secrets
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  NOTIFICATION_SLACK_WEBHOOK: {{ .Values.secrets.notificationSlackWebhook | b64enc | quote }}

---
# PostgreSQL bootstrap credentials (consumed by the bundled StatefulSet)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | b64enc | quote }}
