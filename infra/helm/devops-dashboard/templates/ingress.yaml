{{- if .Values.ingress.enabled }}
# =============================================================================
# Ingress — Route external traffic to frontend and backend services
# =============================================================================
# Routing:
#   /auth      → auth:{{ .Values.auth.port }}
#   /api/v1    → api:{{ .Values.api.port }}
#   /health    → api:{{ .Values.api.port }}
#   /          → frontend:{{ .Values.frontend.port }}
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-dashboard
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default "devops-dashboard-tls" }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{- end }}
      http:
        paths:
          # ---- Auth API ----
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: {{ .Values.auth.port }}

          # ---- REST API (gateway) ----
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}

          # ---- Health endpoint ----
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}

          # ---- Frontend (catch-all, must be last) ----
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
