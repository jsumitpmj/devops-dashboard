# =============================================================================
# Pod Disruption Budgets
# =============================================================================
# Ensure at least 1 pod is always available during voluntary disruptions
# (node drains, cluster upgrades, etc.)
#
# Worker and Notification are excluded (single replica — PDB would block drains).
# =============================================================================

{{- if and .Values.api.enabled .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
{{- end }}

