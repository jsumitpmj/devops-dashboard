{{- if .Values.worker.enabled }}
# =============================================================================
# Worker — Deployment + Service
# IMPORTANT: replicas is pinned to 1 to prevent duplicate job processing.
# For HA, implement leader election or use a distributed lock.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.port }}
      targetPort: {{ .Values.worker.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: worker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: backend
spec:
  # IMPORTANT: Keep at 1 to avoid duplicate job processing.
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    # Recreate ensures the old pod is terminated before the new one starts.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "devops-dashboard.labels" . | nindent 8 }}
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devops-dashboard.serviceAccountName" . }}
      containers:
        - name: worker
          image: {{ include "devops-dashboard.image" (dict "registry" .Values.global.imageRegistry "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.worker.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.worker.port | toString | quote }}
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: JWT_SECRET
            - name: POLL_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: POLL_INTERVAL_MS
            - name: WORKER_STALE_TIMEOUT_MINS
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: WORKER_STALE_TIMEOUT_MINS
            - name: WORKER_SYNC_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: WORKER_SYNC_INTERVAL_MS
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: NOTIFICATION_SERVICE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "devops-dashboard.httpProbes" (dict "path" "/health" "port" "http") | nindent 10 }}
{{- end }}
