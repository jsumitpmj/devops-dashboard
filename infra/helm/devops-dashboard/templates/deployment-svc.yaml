{{- if .Values.deploymentSvc.enabled }}
# =============================================================================
# Deployment Service — Deployment + Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: deployment-svc
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: deployment-svc
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.deploymentSvc.port }}
      targetPort: {{ .Values.deploymentSvc.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: deployment-svc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-svc
  namespace: {{ include "devops-dashboard.namespace" . }}
  labels:
    {{- include "devops-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: deployment-svc
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.deploymentSvc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-svc
  {{- include "devops-dashboard.rollingStrategy" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "devops-dashboard.labels" . | nindent 8 }}
        app.kubernetes.io/name: deployment-svc
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devops-dashboard.serviceAccountName" . }}
      containers:
        - name: deployment-svc
          image: {{ include "devops-dashboard.image" (dict "registry" .Values.global.imageRegistry "image" .Values.deploymentSvc.image) }}
          imagePullPolicy: {{ .Values.deploymentSvc.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.deploymentSvc.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.deploymentSvc.port | toString | quote }}
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: devops-config
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.deploymentSvc.resources | nindent 12 }}
          {{- include "devops-dashboard.httpProbes" (dict "path" "/health" "port" "http") | nindent 10 }}
{{- end }}
